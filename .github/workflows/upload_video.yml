name: Auto Download and Upload Video

on:
  repository_dispatch:
    types: [generate_video]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run download and commit script
        env:
          TEMP_URL: ${{ github.event.client_payload.video_url }}
          FILE_NAME: ${{ github.event.client_payload.file_name }}
        run: |
          python -c "
          import os, requests
          url = os.environ.get('TEMP_URL')
          filename = f'videos/{os.environ.get(\"FILE_NAME\", \"video\")}.mp4'
          
          print('جاري تحميل الفيديو...')
          res = requests.get(url, timeout=120)
          if res.status_code == 200:
              os.makedirs('videos', exist_ok=True)
              with open(filename, 'wb') as f:
                  f.write(res.content)
              print(f'تم حفظ الفيديو: {filename}')
          else:
              exit(1)
          "

      - name: Commit and Push to GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add videos/
          git commit -m "Auto upload video from App"
          git push
