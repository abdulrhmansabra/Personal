name: Auto Download, Upload and Clean Video

on:
  repository_dispatch:
    types: [generate_video, delete_video]

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      # خطوة الرفع والتجهيز
      - name: Run download script
        if: github.event.action == 'generate_video'
        env:
          TEMP_URL: ${{ github.event.client_payload.video_url }}
          FILE_NAME: ${{ github.event.client_payload.file_name }}
        run: |
          python -c "
          import os, requests
          url = os.environ.get('TEMP_URL')
          filename = f'videos/{os.environ.get(\"FILE_NAME\")}.mp4'
          res = requests.get(url, timeout=120)
          if res.status_code == 200:
              os.makedirs('videos', exist_ok=True)
              with open(filename, 'wb') as f:
                  f.write(res.content)
          "

      # خطوة الحذف بناءً على طلب التطبيق
      - name: Delete video file
        if: github.event.action == 'delete_video'
        env:
          FILE_NAME: ${{ github.event.client_payload.file_name }}
        run: |
          rm -f videos/${{ github.event.client_payload.file_name }}.mp4

      # الحفظ والتحديث على المستودع
      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Auto update videos"
          git push
